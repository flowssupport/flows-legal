<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flows — Support</title>
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-faint: #8a8a8a;
    --paper: #fdfdfc;
    --rule: #e6e4df;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: #000000;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  header .wordmark {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.32em;
    color: #ffffff;
  }

  header .subtitle {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #999999;
  }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 28px 100px;
    text-align: center;
  }

  main p.intro {
    font-size: 17px;
    color: var(--ink-soft);
    margin-bottom: 48px;
  }

  .contact-card {
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 36px 28px;
    margin-bottom: 40px;
  }

  .contact-card .label {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 14px;
  }

  .contact-card a.email {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 2px;
  }

  .contact-card .response-time {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 18px;
  }

  .links {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
  }

  .links a {
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
  }

  .links a:hover {
    border-bottom-color: var(--ink-faint);
  }

  .links .divider {
    color: var(--ink-faint);
    margin: 0 12px;
  }

  footer {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 28px 60px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
  }

  footer a {
    color: var(--ink-faint);
  }

  @media (max-width: 480px) {
    main p.intro { font-size: 16px; }
    .contact-card a.email { font-size: 17px; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">FLOWS</div>
  <div class="subtitle">Support</div>
</header>

<main>
  <p class="intro">Have a question, ran into a problem, or want to report something? We're here to help.</p>

  <div class="contact-card">
    <div class="label">Email Us</div>
    <a class="email" href="mailto:flows.support@gmail.com">flows.support@gmail.com</a>
    <div class="response-time">We aim to respond within 24 hours</div>
  </div>

  <div class="links">
    <a href="index.html">Terms of Use</a>
    <span class="divider">·</span>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</main>

<footer>
  FLOWS — <a href="mailto:flows.support@gmail.com">flows.support@gmail.com</a>
</footer>

</body>
</html>
